module.exports = `#graphql
  enum ExportCollection {
    patient diagnosis therapy radiation histology tnm progress metastasis
    tumorBoard consultation status molecularMarker bioMaterial studyPatient
    supplementary diagnostic study kaplanMeier followUp
  }

  enum ExportFieldType { TEXT NUMBER DATE }

  type ExportField {
    id: String!
    type: ExportFieldType!
  }

  enum ExportJoinField { _id patID tumorID therapyID studyKey }
  input ExportRowMatch {
    field: ExportJoinField!
    value: String!
  }

  extend type Query {
    getExportFields(collection: ExportCollection!, filter: String): [ExportField!]!
    getExportRows(collection: ExportCollection!, filter: String, offset: Int! = 0, limit: Int! = 1000, match: ExportRowMatch): [String!]!
  }
`;
